<dialog id="docs-search-dialog" class="docs-search-dialog" aria-labelledby="docs-search-heading" data-pagefind-base="{{ site.Home.RelPermalink }}">
  <div class="docs-search-top"><h2 id="docs-search-heading">Search documentation</h2><button type="button" data-close-search aria-label="Close search">Close</button></div>
  <label for="docs-query">Find a task, tool, or concept</label><input id="docs-query" type="search" autocomplete="off" maxlength="500" placeholder="Try “restore checkpoint”" />
  <label for="docs-topic">Section</label><select id="docs-topic"><option value="">All sections</option>{{ range site.Sections.ByTitle }}<option value="{{ .Section }}">{{ .LinkTitle }}</option>{{ end }}</select>
  <p id="docs-search-status" role="status" aria-live="polite">Search stays in your browser.</p>
  <ol id="docs-search-results"></ol>
</dialog>
