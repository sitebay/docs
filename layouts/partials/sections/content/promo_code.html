{{ if not .Params.deprecated }}
<div class="flex flex-wrap gap-4 justify-between bg-brand pull-out items-center rounded-none md:rounded-md px-4 md:px-8 py-4" x-data="lncPromoCodes()">
  {{/* An optional offer must never turn into an invented price or a foreign signup link. */}}
  <div class="text-white text-md md:text-lg tracking-normal">
    <a :href="signupURL(true)" target="_blank" rel="noopener" class="font-semibold text-white underline">Create a SiteBay account</a>
    <span>to get started.</span>
    <div x-cloak x-show="promoCode()" class="text-sm">
      Promotion code: <span x-text="promoCode()"></span>
    </div>
  </div>
  <a :href="signupURL(true)" target="_blank" rel="noopener" class="bg-transparent text-white font-semibold py-2 px-4 border border-white rounded">Sign Up</a>
</div>
{{ end }}
